<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Görevler" />
<meta name="theme-color" content="#2E5E4E" />
<meta name="description" content="Görevler — sözdizimsiz, tamamen dokunmatik, tek dosyalık günlük yapılacaklar uygulaması. Kurulum yok, sunucu yok, verin tarayıcında kalır." />
<meta property="og:title" content="Görevler — tek dosyalık, dokunmatik to-do uygulaması" />
<meta property="og:description" content="Sözdizimi yok, yazı yazmadan çipler ile tarih/liste/öncelik seçimi. Sağa kaydır tamamla, sola kaydır ertele/sil. Ana ekrana eklenebilir." />
<meta property="og:type" content="website" />
<title>Görevler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --surface2:#F3F1EC; --text:#16181A;
  --muted:#6B6E72; --faint:#9A9DA1; --line:#E7E4DD;
  --accent:#2E5E4E; --accent-soft:#E4EEE8; --accent-ink:#FFFFFF;
  --amber:#B07D2B; --amber-soft:#F5EBDA; --red:#B3443A; --red-soft:#F7E6E3;
  --radius:16px; --radius-sm:10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
[data-theme="dark"]{
  --bg:#121316; --surface:#191A1D; --surface2:#212328; --text:#ECEBE8;
  --muted:#9A9C9F; --faint:#6E7074; --line:#2A2C31;
  --accent:#6FBF9B; --accent-soft:#1B2A25; --accent-ink:#0E1512;
  --amber:#D6A44E; --amber-soft:#2A2313; --red:#E0736A; --red-soft:#2A1A18;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#EAE7DF;}
[data-theme="dark"] body{background:#0A0B0C;}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif; color:var(--text);
  -webkit-font-smoothing:antialiased; letter-spacing:-0.011em; overscroll-behavior:none;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-appearance:none;}
input,textarea{font:inherit;color:inherit;-webkit-appearance:none;}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

/* ---- telefon çerçevesi: mobilde tam ekran, masaüstünde önizleme çerçevesi ---- */
#phone{
  background:var(--bg); color:var(--text); position:relative; overflow:hidden;
  height:100vh; height:100dvh; width:100%; margin:0 auto;
}
@media (min-width:481px){
  body{display:flex;align-items:center;justify-content:center;padding:28px;}
  #phone{
    width:390px; height:min(844px, calc(100vh - 56px)); height:min(844px, calc(100dvh - 56px));
    border-radius:44px;
    box-shadow:0 30px 70px rgba(0,0,0,.35), 0 0 0 10px #0b0c0d, 0 0 0 12px #2b2c2e;
  }
}

#screens{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden;}
.topbar{
  padding:calc(14px + var(--safe-t)) 20px 10px; flex:none;
  display:flex; align-items:center; gap:10px;
}
.topbar h1{font-size:25px; font-weight:800; letter-spacing:-0.03em; margin:0;}
.topbar .date{font-size:12.5px; color:var(--muted); margin-top:1px;}
.ring{width:38px;height:38px;flex:none;margin-left:auto;}
.ring svg{transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:3.5;}
.ring .bg{stroke:var(--surface2);}
.ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .4s cubic-bezier(.16,1,.3,1);}
.ring text{transform:rotate(90deg); transform-origin:center; font-size:10px; font-weight:700; fill:var(--text);}

.content{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 12px 24px;}
.content::-webkit-scrollbar{display:none;}

/* günü planla banner */
.planbtn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--red-soft); border:1px solid var(--red); border-radius:var(--radius-sm);
  padding:12px 14px; margin:4px 8px 14px; color:var(--red); font-weight:700; font-size:13.5px;
}
.planbtn svg{flex:none;}
.planbtn .sub{font-weight:500; color:var(--text); opacity:.8; display:block; font-size:12px; margin-top:1px;}
.planbtn .chev{margin-left:auto; color:var(--red);}

/* liste grup başlığı */
.gttl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:16px 12px 6px;}
.gttl:first-child{margin-top:4px;}

/* görev satırı + kaydırma */
.rowwrap{position:relative; margin:0 8px 2px; border-radius:12px; overflow:hidden;}
.rowactions{position:absolute; inset:0; display:flex; justify-content:flex-end; align-items:stretch;}
.ra-btn{width:76px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:#fff; font-size:11px; font-weight:700;}
.ra-btn.amber{background:var(--amber);}
.ra-btn.red{background:var(--red);}
.row{
  position:relative; display:flex; gap:11px; padding:13px 10px; background:var(--surface);
  border-radius:12px; align-items:flex-start; touch-action:pan-y; will-change:transform;
}
.row.flagged{box-shadow:inset 3px 0 0 var(--red);}
.chk{
  width:26px;height:26px;flex:none;margin-top:1px;border:2px solid var(--line);
  border-radius:50%; display:grid; place-items:center; transition:border-color .15s, background .15s;
}
.chk.done{background:var(--accent); border-color:var(--accent);}
.chk svg{width:14px;height:14px;}
.chk path{stroke:var(--accent-ink); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:20; stroke-dashoffset:20;}
.chk.done path{animation:draw .22s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.rbody{flex:1; min-width:0; padding-top:1px;}
.rtitle{font-size:15px; line-height:1.4; word-break:break-word; transition:opacity .2s;}
.row.done .rtitle{color:var(--faint); text-decoration:line-through; text-decoration-thickness:1.5px; text-decoration-color:var(--faint);}
.rmeta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:3px; font-size:12px; color:var(--muted);}
.rmeta .late{color:var(--red); font-weight:700;}
.rmeta .lst{color:var(--accent);}

/* boş durum */
.empty{padding:60px 24px 20px; text-align:center;}
.empty .ico{width:52px;height:52px;margin:0 auto 14px;color:var(--faint);}
.empty h3{font-size:16px; font-weight:700; margin:0 0 6px;}
.empty p{font-size:13px; color:var(--muted); margin:0; line-height:1.6;}

/* yaklaşan grupları */
.dategroup{margin-bottom:6px;}

/* listeler sekmesi */
.lrow{
  display:flex; align-items:center; gap:12px; padding:14px 14px; margin:0 8px 6px;
  background:var(--surface); border-radius:12px;
}
.ldot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--accent);}
.lname{flex:1; font-size:15px; font-weight:600;}
.lct{font-size:12px; color:var(--faint);}
.ledit,.ldel{padding:6px; color:var(--faint); border-radius:8px;}
.newlist{display:flex; gap:8px; margin:8px 8px 18px; padding:0 6px;}
.newlist input{flex:1; padding:11px 12px; border:1.5px dashed var(--line); border-radius:10px; background:transparent; font-size:14px;}
.newlist button{padding:11px 16px; background:var(--accent); color:var(--accent-ink); border-radius:10px; font-weight:700; font-size:13.5px;}
.backbar{display:flex; align-items:center; gap:8px; padding:2px 8px 10px;}
.backbtn{display:flex; align-items:center; gap:4px; color:var(--accent); font-weight:700; font-size:14px; padding:6px 4px;}
.themerow{display:flex; align-items:center; gap:12px; margin:22px 8px 4px; padding:14px; background:var(--surface); border-radius:12px;}
.switch{margin-left:auto; width:46px; height:27px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); position:relative; flex:none;}
.switch i{position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:var(--faint); transition:transform .18s, background .18s;}
.switch.on{background:var(--accent-soft); border-color:var(--accent);}
.switch.on i{transform:translateX(19px); background:var(--accent);}

/* alt sekme çubuğu + FAB */
.tabbar{
  flex:none; display:flex; align-items:center; position:relative;
  padding:8px 10px calc(8px + var(--safe-b)); background:var(--surface); border-top:1px solid var(--line);
}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--faint); font-size:10.5px; font-weight:600;}
.tab.on{color:var(--accent);}
.tab svg{width:22px;height:22px;}
.fabspot{width:64px; flex:none;}
.fab{
  position:absolute; left:50%; top:-26px; transform:translateX(-50%);
  width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; box-shadow:0 8px 20px rgba(46,94,78,.4); border:4px solid var(--bg);
}
[data-theme="dark"] .fab{box-shadow:0 8px 20px rgba(0,0,0,.5);}

/* scrim + alt sayfa (bottom sheet) */
.scrim{position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:20; animation:fade .15s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:21; background:var(--surface);
  border-radius:22px 22px 0 0; max-height:88%; display:flex; flex-direction:column;
  animation:up .22s cubic-bezier(.16,1,.3,1); padding-bottom:var(--safe-b);
}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.handle{width:36px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 6px;flex:none;}
.sheethead{display:flex; align-items:center; padding:2px 16px 8px; flex:none;}
.sheethead b{font-size:13px;}
.sheetbody{overflow-y:auto; padding:0 16px 18px; flex:1; min-height:0; -webkit-overflow-scrolling:touch;}
.xbtn{padding:6px; color:var(--faint); border-radius:8px;}
.titlein{
  width:100%; border:none; background:none; font-size:19px; font-weight:700; padding:8px 2px 14px;
  border-bottom:1px solid var(--line); margin-bottom:14px; letter-spacing:-0.01em;
}
.titlein::placeholder{color:var(--faint); font-weight:600;}
.seclabel{font-size:11px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:0 2px 8px;}
.chiprow{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px;}
.chip{
  padding:9px 13px; border-radius:99px; border:1.5px solid var(--line); font-size:13px; color:var(--muted); font-weight:600;
  display:flex; align-items:center; gap:6px;
}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.chip.flagon{background:var(--red-soft); border-color:var(--red); color:var(--red);}
.timein{padding:9px 12px; border:1.5px solid var(--line); border-radius:99px; font-size:13px; background:transparent;}

/* takvim */
.cal{background:var(--surface2); border-radius:14px; padding:12px; margin-bottom:18px;}
.calnav{display:flex; align-items:center; margin-bottom:8px;}
.calnav b{font-size:14px; flex:1; text-align:center;}
.calarrow{padding:6px 10px; color:var(--muted); font-weight:700;}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center;}
.calgrid .wd{font-size:10px; color:var(--faint); font-weight:700; padding:4px 0;}
.calday{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:13px; min-height:34px;}
.calday.today{font-weight:800; color:var(--accent);}
.calday.sel{background:var(--accent); color:var(--accent-ink); font-weight:700;}
.calday.blank{visibility:hidden;}

.subrow{display:flex; align-items:center; gap:9px; padding:8px 2px; font-size:14px;}
.subrow input[type=checkbox]{width:18px;height:18px; accent-color:var(--accent);}
.subrow span[data-done="1"]{color:var(--faint); text-decoration:line-through;}
.subadd{width:100%; padding:9px 4px; border:none; border-bottom:1px dashed var(--line); background:none; font-size:14px; margin-top:2px;}
.notearea{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; min-height:64px; font-size:13.5px; line-height:1.55; resize:vertical; margin-bottom:18px;}

.savebtn{
  width:100%; padding:15px; background:var(--accent); color:var(--accent-ink); border-radius:14px;
  font-weight:800; font-size:15.5px; margin-top:4px; opacity:1; transition:opacity .15s;
}
.savebtn:disabled{opacity:.4;}
.delbtn{width:100%; padding:13px; color:var(--red); font-weight:700; font-size:14px; margin-top:6px;}

/* günü planla tam ekran */
.plan{position:absolute; inset:0; z-index:22; background:var(--bg); display:flex; flex-direction:column;}
.planhead{display:flex; align-items:center; padding:calc(14px + var(--safe-t)) 16px 8px;}
.plandots{margin-left:auto; font-size:12px; color:var(--faint);}
.plancard{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 28px calc(24px + var(--safe-b));}
.plancard .lbl{font-size:11px; color:var(--red); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
.plancard h2{font-size:23px; font-weight:800; text-align:center; letter-spacing:-0.02em; margin:0 0 30px; line-height:1.35;}
.plangrid{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px;}
.planopt{padding:16px; border-radius:14px; font-weight:700; font-size:15px; text-align:center; border:1.5px solid var(--line);}
.planopt.p1{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.planopt.p2{background:var(--amber-soft); color:var(--amber); border-color:var(--amber);}
.planopt.p3{background:var(--red-soft); color:var(--red); border-color:var(--red);}
.plandone{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:0 30px;}
.plandone .emoji{font-size:52px; margin-bottom:6px;}
.plandone h2{font-size:20px; margin:0;}
.plandone p{color:var(--muted); font-size:13.5px; margin:0;}

/* toast */
.toast{
  position:absolute; left:16px; right:16px; z-index:30; bottom:calc(84px + var(--safe-b));
  display:flex; align-items:center; gap:14px; padding:12px 15px; border-radius:14px;
  background:var(--text); color:var(--bg); font-size:13.5px; box-shadow:0 10px 26px rgba(0,0,0,.25);
  animation:up2 .2s cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"] .toast{background:var(--surface); border:1px solid var(--line);}
@keyframes up2{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.toast button{font-weight:800; text-decoration:underline; text-underline-offset:2px; margin-left:auto; flex:none;}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important;}}
</style>
</head>

<div id="phone"><div id="screens"></div></div>

<script>
"use strict";

/* ============================================================ tarih yardımcıları
   Tüm tarihler takvim günü ("YYYY-MM-DD") olarak saklanır; bir andan (timestamp)
   değil bir günden bahsettiğimiz için saat dilimi/DST sorunları hiç doğmaz. */
const pad = n => String(n).padStart(2,"0");
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const todayKey = () => toKey(new Date());
const addDays = (k,n) => { const d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); };
const addMonths = (k,n) => {
  const d=fromKey(k); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,last)); return toKey(d);
};
const diffDays = (a,b) => Math.round((fromKey(a)-fromKey(b))/86400000);

const TR_DAY = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const TR_DAY_SHORT = ["Pz","Pt","Sa","Ça","Pe","Cu","Ct"];
const TR_MON = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

function humanDate(key){
  if(!key) return "";
  const d = diffDays(key, todayKey());
  if(d===0) return "Bugün";
  if(d===1) return "Yarın";
  if(d===-1) return "Dün";
  if(d>1 && d<7) return TR_DAY[fromKey(key).getDay()];
  if(d<0) return `${Math.abs(d)} gün gecikti`;
  const dt=fromKey(key); const sameYear = dt.getFullYear()===new Date().getFullYear();
  return `${dt.getDate()} ${TR_MON[dt.getMonth()]}${sameYear?"":" "+dt.getFullYear()}`;
}
function weekendKey(){
  const dow = fromKey(todayKey()).getDay(); // 0 Paz .. 6 Cmt
  if(dow===0 || dow===6) return todayKey();
  return addDays(todayKey(), (6-dow+7)%7);
}

/* ---- kesirli sıralama anahtarı: sürükleme/ekleme sonrası tüm listeyi
   yeniden numaralandırmadan tek satırı konumlandırır (fractional indexing) --- */
function midString(prev,next){
  let p,n,pos,str="";
  for(pos=0; p===n; pos++){ p = pos<prev.length?prev.charCodeAt(pos):96; n = pos<next.length?next.charCodeAt(pos):123; }
  str = prev.slice(0,pos-1);
  if(p===96){ while(n===97){ n = pos<next.length?next.charCodeAt(pos++):123; str+="a"; } if(n===98){ str+="a"; n=123; } }
  else if(p+1===n){ str+=String.fromCharCode(p); n=123; while((p = pos<prev.length?prev.charCodeAt(pos++):96)===122) str+="z"; }
  return str + String.fromCharCode(Math.ceil((p+n)/2));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---- tekrar: bir sonraki tarih ---- */
function nextOccurrence(task){
  const r = task.repeat; if(!r) return null;
  const base = task.due && diffDays(task.due, todayKey())>0 ? task.due : todayKey();
  if(r==="daily") return addDays(base,1);
  if(r==="weekdays"){ let n=addDays(base,1), g=0; while([0,6].includes(fromKey(n).getDay()) && g++<7) n=addDays(n,1); return n; }
  if(r==="weekly") return addDays(base,7);
  if(r==="monthly") return addMonths(base,1);
  return addDays(base,1);
}
const REPEAT_LABEL = { daily:"Her gün", weekdays:"Hafta içi", weekly:"Her hafta", monthly:"Her ay" };

/* ============================================================ ikonlar */
const I = {
  today:"M4 5h16v16H4zM4 10h16M9 3v4M15 3v4",
  soon:"M12 7v5l3 2M21 12a9 9 0 1 1-9-9",
  lists:"M4 6h16M4 12h16M4 18h10",
  plus:"M12 5v14M5 12h14",
  x:"M6 6l12 12M18 6L6 18",
  back:"M15 5l-7 7 7 7",
  chev:"M9 5l7 7-7 7",
  flag:"M5 3v18M5 4h11l-2.5 4L16 12H5",
  clock:"M12 7v5l3 2M21 12a9 9 0 1 1-9-9",
  repeat:"M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
  trash:"M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13",
  edit:"M4 20h4L19 9l-4-4L4 16v4zM14 5l4 4",
  cal:"M4 5h16v16H4zM4 10h16M8 3v4M16 3v4",
  check:"M4 12l5 5L20 6",
  empty:"M4 6h16M4 12h10M4 18h7",
  sun:"M12 4V2M12 22v-2M4 12H2M22 12h-2M6 6L4.5 4.5M19.5 19.5L18 18M6 18l-1.5 1.5M19.5 4.5L18 6M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z",
  moon:"M20 14a8 8 0 1 1-9.9-9.9A7 7 0 0 0 20 14z",
};
function svg(d,s=15,sw=1.8){
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${
    Array.isArray(d)? d.map(p=>`<path d="${p}"/>`).join("") : `<path d="${d}"/>`
  }</svg>`;
}

/* ============================================================ depolama */
const STORE_KEY = "gorevler-v2";
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
let saveTimer=null;
function writeNow(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({tasks:S.tasks, lists:S.lists, theme:S.theme})); }
  catch(e){ console.warn("Kayıt başarısız:", e); }
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeNow,150);
}
// Uygulama arka plana alınırken / sekme kapanırken bekleyen kaydı anında yaz —
// aksi halde son 150ms içindeki işlem kaybolabilir.
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden"){ clearTimeout(saveTimer); writeNow(); } });
window.addEventListener("pagehide", ()=>{ clearTimeout(saveTimer); writeNow(); });

/* ============================================================ örnek veri (ilk açılış) */
function seedTasks(){
  let k="a"; const mk=(t)=>{k=midString(k,""); return {id:uid(), order:k, createdAt:new Date().toISOString(), doneAt:null, subtasks:[], note:"", repeat:null, time:null, flag:false, list:"Gelen Kutusu", done:false, ...t};};
  return [
    mk({title:"Bu görevi sağa kaydırarak tamamla", due:todayKey(), flag:true}),
    mk({title:"Sola kaydırarak ertele ya da sil", due:todayKey()}),
    mk({title:"Yaklaşan görevler burada, tarihine göre gruplu", due:addDays(todayKey(),3)}),
  ];
}

/* ============================================================ durum */
const S = {
  tasks: [], lists: ["Gelen Kutusu"], theme:"light",
  tab: "today",           // today | soon | lists
  listView: null,         // Listeler alt-görünümde açık liste adı
  sheet: null,            // null | "add" | "detail" | "planday"
  draft: null,            // ekleme taslağı
  editId: null,           // düzenlenen görev id
  editBuf: null,          // {title, note} — yazarken tam yeniden çizimi engeller
  calOpenIn: null,        // "add" | "edit" — takvim hangi sayfada açık
  calMonth: null,         // {y,m}
  planIds: [], planIdx: 0,
  toast: null, toastSnap: null,
};
let toastTimer=null;

(function init(){
  const saved = loadState();
  if(saved && Array.isArray(saved.tasks) && saved.tasks.length){
    S.tasks = saved.tasks; S.lists = saved.lists && saved.lists.length ? saved.lists : ["Gelen Kutusu"];
    S.theme = saved.theme || "light";
  } else {
    S.tasks = seedTasks();
    persist(); // ilk açılışta bile durum kalıcı olsun — hiç etkileşim olmasa bile
  }
})();

/* ============================================================ türetilmiş veri */
function liveTasks(){ return S.tasks.filter(t=>!t.deletedAt); }
function overdueTasks(){ const t0=todayKey(); return liveTasks().filter(t=>!t.done && t.due && diffDays(t.due,t0)<0); }
function todayAgenda(){
  const t0=todayKey();
  return liveTasks().filter(t=> t.due && diffDays(t.due,t0)<=0 );
}
function upcomingTasks(){
  const t0=todayKey();
  return liveTasks().filter(t=>!t.done && t.due && diffDays(t.due,t0)>0)
    .sort((a,b)=> a.due===b.due ? sortKey(a)-sortKey(b) || (a.order<b.order?-1:1) : (a.due<b.due?-1:1));
}
function sortKey(t){ return t.flag?0:1; }
function sortAgenda(list){
  return [...list].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    if(a.done && b.done) return (b.doneAt||"").localeCompare(a.doneAt||"");
    if(a.flag!==b.flag) return a.flag?-1:1;
    if(a.time && b.time && a.time!==b.time) return a.time<b.time?-1:1;
    if(a.time && !b.time) return -1;
    if(!a.time && b.time) return 1;
    return a.order<b.order?-1:1;
  });
}
function listCounts(){
  const m=new Map(S.lists.map(l=>[l,0]));
  liveTasks().forEach(t=>{ if(!t.done && m.has(t.list)) m.set(t.list, m.get(t.list)+1); });
  return m;
}

/* ============================================================ eylemler */
function commit(mutator, toastMsg){
  if(toastMsg){
    clearTimeout(toastTimer);
    S.toastSnap = { tasks: JSON.parse(JSON.stringify(S.tasks)), lists: [...S.lists] };
    S.toast = toastMsg;
    toastTimer = setTimeout(()=>{ S.toast=null; render(); }, 5000);
  }
  mutator();
  persist();
  render();
}
function undoLast(){
  if(!S.toastSnap) return;
  S.tasks = S.toastSnap.tasks; S.lists = S.toastSnap.lists;
  S.toast=null; S.toastSnap=null; clearTimeout(toastTimer);
  persist(); render();
}

function newDraft(base){
  return Object.assign({
    title:"", due: null, time:null, list:"Gelen Kutusu", flag:false, repeat:null,
  }, base||{});
}
function openAdd(){
  const base = { list: S.listView || "Gelen Kutusu" };
  if(S.tab==="today") base.due = todayKey();
  S.draft = newDraft(base);
  S.calOpenIn=null; S.sheet="add"; render();
  setTimeout(()=>{ const el=document.getElementById("titleInput"); if(el){ el.focus(); } },50);
}
function closeSheet(){ S.sheet=null; S.draft=null; S.editId=null; S.editBuf=null; S.calOpenIn=null; render(); }

function saveDraft(){
  const title = (S.draft.title||"").trim();
  if(!title) return;
  const last = S.tasks.length ? S.tasks.reduce((a,b)=> a.order>b.order?a:b).order : "a";
  const task = {
    id:uid(), title, note:"", list:S.draft.list||"Gelen Kutusu", due:S.draft.due, time:S.draft.time,
    flag:!!S.draft.flag, repeat:S.draft.repeat, subtasks:[], done:false, doneAt:null,
    createdAt:new Date().toISOString(), order:midString(last,""),
  };
  commit(()=>{ S.tasks.push(task); });
  closeSheet();
}

function toggleDone(id){
  commit(()=>{
    const idx = S.tasks.findIndex(t=>t.id===id);
    if(idx<0) return;
    const t = S.tasks[idx];
    if(t.done){ t.done=false; t.doneAt=null; return; }
    t.done=true; t.doneAt=new Date().toISOString();
    if(t.repeat){
      const nd = nextOccurrence(t);
      S.tasks.push({...t, id:uid(), due:nd, done:false, doneAt:null, flag:false,
        subtasks:(t.subtasks||[]).map(s=>({...s,done:false})),
        createdAt:new Date().toISOString(), order:midString(t.order,"")});
    }
  });
}
function patchTask(id, data){ commit(()=>{ const t=S.tasks.find(x=>x.id===id); if(t) Object.assign(t,data); }); }
function deleteTask(id){ commit(()=>{ const t=S.tasks.find(x=>x.id===id); if(t) t.deletedAt=new Date().toISOString(); }, "Görev silindi"); }
function rescheduleTomorrow(id){ patchTask(id,{due:addDays(S.tasks.find(t=>t.id===id).due||todayKey(),1)}); }

function openDetail(id){
  const t = S.tasks.find(x=>x.id===id); if(!t) return;
  S.editId=id; S.editBuf={title:t.title, note:t.note||""}; S.calOpenIn=null; S.sheet="detail"; render();
}
function commitEditBuf(){
  if(!S.editId || !S.editBuf) return;
  const t = S.tasks.find(x=>x.id===S.editId); if(!t) return;
  if(t.title!==S.editBuf.title || (t.note||"")!==S.editBuf.note){
    t.title = S.editBuf.title.trim() || t.title; t.note = S.editBuf.note; persist();
  }
}
function closeDetail(){ commitEditBuf(); S.sheet=null; S.editId=null; S.editBuf=null; render(); }

/* liste yönetimi */
function addList(name){
  const n = name.trim(); if(!n || S.lists.includes(n)) return;
  commit(()=>{ S.lists.push(n); });
}
function deleteList(name){
  if(name==="Gelen Kutusu") return;
  if(S.listView===name) S.listView=null;
  commit(()=>{
    S.lists = S.lists.filter(l=>l!==name);
    S.tasks.forEach(t=>{ if(t.list===name) t.list="Gelen Kutusu"; });
  }, `"${name}" silindi, görevleri Gelen Kutusu'na taşındı`);
}
function renameList(oldName, newName){
  const n=newName.trim();
  if(!n || n===oldName || S.lists.includes(n) || oldName==="Gelen Kutusu") return;
  if(S.listView===oldName) S.listView=n;
  commit(()=>{
    S.lists = S.lists.map(l=> l===oldName?n:l);
    S.tasks.forEach(t=>{ if(t.list===oldName) t.list=n; });
  });
}

/* günü planla */
function openPlanDay(){
  S.planIds = overdueTasks().map(t=>t.id);
  S.planIdx = 0; S.sheet="planday"; render();
}
function planAct(action){
  const id = S.planIds[S.planIdx];
  if(id){
    if(action==="today") patchTaskSilent(id,{due:todayKey()});
    else if(action==="tomorrow") patchTaskSilent(id,{due:addDays(todayKey(),1)});
    else if(action==="delete") { const t=S.tasks.find(x=>x.id===id); if(t) t.deletedAt=new Date().toISOString(); persist(); }
  }
  S.planIdx++; render();
}
function patchTaskSilent(id,data){ const t=S.tasks.find(x=>x.id===id); if(t) Object.assign(t,data); persist(); }

/* ============================================================ dokunma/kaydırma */
let swipeState = null;   // {id, el, startX, startY, dx, dragging, mode}
let openSwipeId = null;

function closeOpenSwipe(){
  if(openSwipeId){
    const el = document.querySelector(`.row[data-id="${CSS.escape(openSwipeId)}"]`);
    if(el){ el.style.transition="transform .18s ease"; el.style.transform="translateX(0)"; }
    openSwipeId=null;
  }
}

function attachSwipe(rowEl, task){
  const ACTION_W = 152; // iki aksiyon butonu genişliği
  let pressTimer = null;
  let longPressed = false;

  rowEl.addEventListener("pointerdown", (e)=>{
    if(e.target.closest(".chk")) return; // checkbox kendi davranışını yönetir
    if(openSwipeId && openSwipeId!==task.id) closeOpenSwipe();
    longPressed = false;
    swipeState = { id:task.id, startX:e.clientX, startY:e.clientY, dx:0, dragging:false,
      base: openSwipeId===task.id ? -ACTION_W : 0 };
    rowEl.setPointerCapture(e.pointerId);
    rowEl.style.transition = "none";
    // dokunma-dışı erişilebilirlik: hareket olmadan basılı tutunca da aksiyonları aç
    pressTimer = setTimeout(()=>{
      if(!swipeState || swipeState.dragging) return; // bu arada kaydırmaya dönüştüyse iptal
      longPressed = true;
      rowEl.style.transition = "transform .18s ease";
      rowEl.style.transform = `translateX(${-ACTION_W}px)`;
      openSwipeId = task.id;
    }, 500);
  });

  rowEl.addEventListener("pointermove", (e)=>{
    if(!swipeState || swipeState.id!==task.id) return;
    const dx = e.clientX - swipeState.startX;
    const dy = e.clientY - swipeState.startY;
    if(!swipeState.dragging){
      if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)*1.4){ swipeState.dragging = true; clearTimeout(pressTimer); }
      else if(Math.abs(dy) > 8){ swipeState=null; clearTimeout(pressTimer); return; } // dikey kaydırma — sayfaya bırak
      else return;
    }
    let total = swipeState.base + dx;
    total = Math.max(-ACTION_W-10, Math.min(90, total));
    swipeState.dx = total;
    rowEl.style.transform = `translateX(${total}px)`;
  });

  function finish(){
    clearTimeout(pressTimer);
    if(longPressed){ longPressed=false; swipeState=null; return; } // uzun-bas zaten açtı; bırakınca kapanmasın
    if(!swipeState || swipeState.id!==task.id || !swipeState.dragging){ swipeState=null; return; } // sade dokunuş — click'e bırak
    const total = swipeState.dx;
    rowEl.style.transition = "transform .2s cubic-bezier(.16,1,.3,1)";
    if(total > 64){
      rowEl.style.transform = "translateX(120%)";
      setTimeout(()=> toggleDone(task.id), 140);
    } else if(total < -ACTION_W*0.55){
      rowEl.style.transform = `translateX(${-ACTION_W}px)`;
      openSwipeId = task.id;
    } else {
      rowEl.style.transform = "translateX(0)";
      if(openSwipeId===task.id) openSwipeId=null;
    }
    swipeState = null;
  }
  rowEl.addEventListener("pointerup", finish);
  rowEl.addEventListener("pointercancel", finish);
}

/* ============================================================ render: satır bileşeni */
function taskRowHTML(t){
  const late = t.due && !t.done && diffDays(t.due, todayKey())<0;
  const subDone = (t.subtasks||[]).filter(s=>s.done).length;
  const metaParts = [];
  if(t.due) metaParts.push(`<span class="${late?'late':''}">${humanDate(t.due)}${t.time?` · ${t.time}`:''}</span>`);
  if(t.repeat) metaParts.push(`<span>↻ ${REPEAT_LABEL[t.repeat]}</span>`);
  if(t.list && t.list!=="Gelen Kutusu") metaParts.push(`<span class="lst">${esc(t.list)}</span>`);
  if((t.subtasks||[]).length) metaParts.push(`<span class="mono">${subDone}/${t.subtasks.length}</span>`);

  return `
  <div class="rowwrap">
    <div class="rowactions">
      <button class="ra-btn amber" data-act="tomorrow" data-id="${t.id}">${svg(I.clock,18,2)}Yarına ertele</button>
      <button class="ra-btn red" data-act="delete" data-id="${t.id}">${svg(I.trash,18,2)}Sil</button>
    </div>
    <div class="row ${t.done?'done':''} ${t.flag&&!t.done?'flagged':''}" data-id="${t.id}">
      <button class="chk ${t.done?'done':''}" data-act="toggle" data-id="${t.id}" aria-label="Tamamla">${svg([`M4 12l5 5L20 6`].join(""),14,3)}</button>
      <div class="rbody" data-act="open" data-id="${t.id}">
        <div class="rtitle">${esc(t.title)}</div>
        ${metaParts.length?`<div class="rmeta">${metaParts.join("")}</div>`:""}
      </div>
    </div>
  </div>`;
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function emptyStateHTML(title, sub){
  return `<div class="empty">
    <div class="ico">${svg(I.empty,52,1.3)}</div>
    <h3>${title}</h3><p>${sub}</p>
  </div>`;
}

/* ============================================================ render: ekranlar */
function screenToday(){
  const agenda = sortAgenda(todayAgenda());
  const total = agenda.length, done = agenda.filter(t=>t.done).length;
  const overdue = overdueTasks();
  const dateStr = new Date().toLocaleDateString("tr-TR",{weekday:"long", day:"numeric", month:"long"});
  const r = 15.5, C = 2*Math.PI*r, off = total? C*(1-done/total) : C;

  let body = "";
  if(overdue.length>0){
    body += `<button class="planbtn" data-act="planday">
      ${svg(I.cal,20,2)}
      <span>${overdue.length} görev gecikti<span class="sub">Günü Planla'yı aç, tek tek karar ver</span></span>
      <span class="chev">${svg(I.chev,16,2)}</span>
    </button>`;
  }
  if(agenda.length===0){
    body += emptyStateHTML("Bugün için iş yok", "Aşağıdaki + ile yeni bir görev ekle, ya da Yaklaşan'dan bir şey buraya çek.");
  } else {
    body += agenda.map(taskRowHTML).join("");
  }

  return `
  <div class="topbar">
    <div><h1>Bugün</h1><div class="date">${cap(dateStr)}</div></div>
    ${total>0?`<div class="ring"><svg width="38" height="38" viewBox="0 0 38 38">
      <circle class="bg" cx="19" cy="19" r="${r}"/>
      <circle class="fg" cx="19" cy="19" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
    </svg><text x="19" y="19" text-anchor="middle" dominant-baseline="central">${done}/${total}</text></div>`:""}
  </div>
  <div class="content">${body}</div>`;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function screenSoon(){
  const list = upcomingTasks();
  let body;
  if(list.length===0){
    body = emptyStateHTML("İleri tarihli iş yok", "Bir göreve tarih verirsen, tarihi gelene kadar burada sessizce bekler.");
  } else {
    const groups = [];
    let curKey=null, curArr=null;
    list.forEach(t=>{
      if(t.due!==curKey){ curKey=t.due; curArr=[]; groups.push([humanDate(t.due), curArr]); }
      curArr.push(t);
    });
    body = groups.map(([label,items])=>`
      <div class="dategroup">
        <div class="gttl">${label}</div>
        ${items.map(taskRowHTML).join("")}
      </div>`).join("");
  }
  return `
  <div class="topbar"><div><h1>Yaklaşan</h1><div class="date">Tarihi gelmemiş işler</div></div></div>
  <div class="content">${body}</div>`;
}

function screenLists(){
  if(S.listView){
    const name = S.listView;
    const items = sortAgenda(liveTasks().filter(t=>t.list===name));
    const body = items.length ? items.map(taskRowHTML).join("")
      : emptyStateHTML("Liste boş", `"${esc(name)}" içine FAB ile görev ekleyebilirsin.`);
    return `
    <div class="topbar">
      <div class="backbar" style="padding:0;flex:1;">
        <button class="backbtn" data-act="listback">${svg(I.back,16,2.2)}Listeler</button>
      </div>
    </div>
    <div style="padding:0 20px 6px;"><h1 style="font-size:22px;">${esc(name)}</h1></div>
    <div class="content">${body}</div>`;
  }

  const counts = listCounts();
  const rows = S.lists.map(l=>`
    <div class="lrow" data-act="openlist" data-list="${esc(l)}">
      <span class="ldot" style="${l==='Gelen Kutusu'?'':''}"></span>
      <span class="lname">${esc(l)}</span>
      <span class="lct mono">${counts.get(l)||0}</span>
      ${l!=="Gelen Kutusu" ? `
        <button class="ledit" data-act="renamelist" data-list="${esc(l)}" title="Adını değiştir" aria-label="Listeyi yeniden adlandır">${svg(I.edit,15,1.8)}</button>
        <button class="ldel" data-act="dellist" data-list="${esc(l)}" title="Sil" aria-label="Listeyi sil">${svg(I.trash,15,1.8)}</button>
      ` : ""}
    </div>`).join("");

  return `
  <div class="topbar"><div><h1>Listeler</h1><div class="date">Görevlerini grupla</div></div></div>
  <div class="content">
    ${rows}
    <div class="newlist">
      <input id="newListInput" placeholder="Yeni liste adı" />
      <button data-act="addlist">${svg(I.plus,15,2.4)} Ekle</button>
    </div>
    <div class="themerow">
      <span>${svg(S.theme==='dark'?I.moon:I.sun,17,1.8)}</span>
      <span style="font-size:14px;font-weight:600;">Koyu görünüm</span>
      <button class="switch ${S.theme==='dark'?'on':''}" data-act="toggletheme"><i></i></button>
    </div>
  </div>`;
}

/* ---- ekleme / düzenleme alt-sayfası ortak parçaları ---- */
function dateChipsHTML(draft, target){
  const wknd = weekendKey(), nextwk = addDays(todayKey(),7);
  const chip = (label, val, extra="")=>`<button class="chip ${draft.due===val?'on':''}" data-act="setdate" data-target="${target}" data-val="${val||''}">${label}${extra}</button>`;
  return `
  <div class="seclabel">Ne zaman</div>
  <div class="chiprow">
    ${chip("Bugün", todayKey())}
    ${chip("Yarın", addDays(todayKey(),1))}
    ${chip("Hafta sonu", wknd)}
    ${chip("Gelecek hafta", nextwk)}
    <button class="chip ${S.calOpenIn===target?'on':''}" data-act="togglecal" data-target="${target}">${svg(I.cal,14,2)} ${draft.due && ![todayKey(),addDays(todayKey(),1),wknd,nextwk].includes(draft.due) ? humanDate(draft.due) : "Tarih seç"}</button>
    ${draft.due?`<button class="chip" data-act="setdate" data-target="${target}" data-val="">${svg(I.x,13,2.4)} Tarihi kaldır</button>`:""}
  </div>`;
}
function calendarHTML(draft, target){
  if(S.calOpenIn!==target) return "";
  if(!S.calMonth){ const d=fromKey(draft.due||todayKey()); S.calMonth={y:d.getFullYear(), m:d.getMonth()}; }
  const {y,m} = S.calMonth;
  const first = new Date(y,m,1);
  const lead = (first.getDay()+6)%7; // Pazartesi=0
  const days = new Date(y,m+1,0).getDate();
  const t0 = todayKey();
  let cells="";
  for(let i=0;i<lead;i++) cells += `<div class="calday blank"></div>`;
  for(let d=1; d<=days; d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const cls = ["calday"]; if(key===t0) cls.push("today"); if(key===draft.due) cls.push("sel");
    cells += `<button class="${cls.join(' ')}" data-act="pickcal" data-target="${target}" data-val="${key}">${d}</button>`;
  }
  return `
  <div class="cal">
    <div class="calnav">
      <button class="calarrow" data-act="calnav" data-dir="-1" aria-label="Önceki ay">${svg(I.back,15,2.4)}</button>
      <b>${TR_MON[m]} ${y}</b>
      <button class="calarrow" data-act="calnav" data-dir="1" aria-label="Sonraki ay">${svg(I.chev,15,2.4)}</button>
    </div>
    <div class="calgrid">
      ${TR_DAY_SHORT.slice(1).concat(TR_DAY_SHORT[0]).map(d=>`<div class="wd">${d}</div>`).join("")}
      ${cells}
    </div>
  </div>`;
}

    <div class="sheethead"><b>Yeni görev</b><button class="xbtn" style="margin-left:auto" data-act="closesheet" aria-label="Kapat">${svg(I.x,17,2)}</button></div>
    <div class="sheetbody">
      <input id="titleInput" class="titlein" placeholder="Ne yapman gerekiyor?" value="${esc(d.title)}" data-act="draftTitle" />
      ${dateChipsHTML(d,"add")}
      ${calendarHTML(d,"add")}
      ${timeFlagHTML(d,"add")}
      ${listChipsHTML(d,"add")}
      ${repeatChipsHTML(d,"add")}
      <button class="savebtn" data-act="save" ${d.title.trim()?"":"disabled"}>Kaydet</button>
    </div>
  </div>`;
}

function sheetDetail(){
  const t = S.tasks.find(x=>x.id===S.editId); if(!t) return "";
  const d = { due:t.due, time:t.time, list:t.list, flag:t.flag, repeat:t.repeat };
  const sub = t.subtasks||[]; const subDone = sub.filter(s=>s.done).length;
  return `
  <div class="scrim" data-act="closedetail"></div>
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheethead"><b>Görev</b><button class="xbtn" style="margin-left:auto" data-act="closedetail" aria-label="Kapat">${svg(I.x,17,2)}</button></div>
    <div class="sheetbody">
      <input id="titleInput" class="titlein" value="${esc(S.editBuf.title)}" data-act="editTitle" />
      ${dateChipsHTML(d,"edit")}
      ${calendarHTML(d,"edit")}
      ${timeFlagHTML(d,"edit")}
      ${listChipsHTML(d,"edit")}
      ${repeatChipsHTML(d,"edit")}

      <div class="seclabel">Not</div>
      <textarea class="notearea" id="noteInput" placeholder="Bağlam, bağlantı, hatırlatma…" data-act="editNote">${esc(S.editBuf.note)}</textarea>

      <div class="seclabel">Alt görevler ${sub.length?`<span class="mono">(${subDone}/${sub.length})</span>`:""}</div>
      ${sub.map(s=>`
        <div class="subrow">
          <input type="checkbox" ${s.done?"checked":""} data-act="togglesub" data-sub="${s.id}" />
          <span data-done="${s.done?1:0}" style="flex:1">${esc(s.title)}</span>
          <button class="xbtn" data-act="delsub" data-sub="${s.id}" aria-label="Alt görevi sil">${svg(I.x,13,2.2)}</button>
        </div>`).join("")}
      <input class="subadd" id="subInput" placeholder="Alt görev ekle, Enter'a bas" />

      <button class="delbtn" data-act="deletetask">${svg(I.trash,15,2)} Görevi sil</button>
    </div>
  </div>`;
}

function sheetPlanDay(){
  const total = S.planIds.length;
  if(S.planIdx >= total){
    return `<div class="plan">
      <div class="planhead"><button class="xbtn" data-act="closeplan" aria-label="Kapat">${svg(I.x,18,2)}</button></div>
      <div class="plandone">
        <div class="emoji">🎉</div>
        <h2>Günün hazır</h2>
        <p>${total} görevi gözden geçirdin. Bugün ekranı artık güncel.</p>
        <button class="savebtn" style="margin-top:18px;max-width:220px" data-act="closeplan">Bugüne dön</button>
      </div>
    </div>`;
  }
  const t = S.tasks.find(x=>x.id===S.planIds[S.planIdx]);
  if(!t) return `<div class="plan"></div>`;
  return `<div class="plan">
    <div class="planhead">
      <button class="xbtn" data-act="closeplan" aria-label="Kapat">${svg(I.x,18,2)}</button>
      <span class="plandots mono">${S.planIdx+1}/${total}</span>
    </div>
    <div class="plancard">
      <div class="lbl">${humanDate(t.due)}</div>
      <h2>${esc(t.title)}</h2>
      <div class="plangrid">
        <button class="planopt p1" data-act="planact" data-a="today">Bugün</button>
        <button class="planopt p2" data-act="planact" data-a="tomorrow">Yarına ertele</button>
        <button class="planopt p3" data-act="planact" data-a="delete">Sil</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================ ana çerçeve */
function tabbarHTML(){
  const tabs = [["today","Bugün",I.today],["soon","Yaklaşan",I.soon],["lists","Listeler",I.lists]];
  return `
  <div class="tabbar">
    ${tabs.map(([id,label,icon])=>`
      <button class="tab ${S.tab===id?'on':''}" data-act="tab" data-val="${id}">${svg(icon,21,1.7)}<span>${label}</span></button>
    `).join("")}
    <div class="fabspot">
      <button class="fab" data-act="openadd">${svg(I.plus,24,2.4)}</button>
    </div>
  </div>`;
}

function render(){
  const root = document.getElementById("screens");
  document.getElementById("phone").setAttribute("data-theme", S.theme);

  let screen = S.tab==="today" ? screenToday() : S.tab==="soon" ? screenSoon() : screenLists();

  let overlay = "";
  if(S.sheet==="add") overlay = sheetAdd();
  else if(S.sheet==="detail") overlay = sheetDetail();
  else if(S.sheet==="planday") overlay = sheetPlanDay();

  let toast = "";
  if(S.toast){
    toast = `<div class="toast"><span>${esc(S.toast)}</span><button data-act="undo">Geri al</button></div>`;
  }

  root.innerHTML = `
    <div style="display:flex;flex-direction:column;height:100%;">
      ${screen}
      ${tabbarHTML()}
    </div>
    ${overlay}
    ${toast}
  `;

  // satırlara kaydırma davranışını bağla
  root.querySelectorAll(".row[data-id]").forEach(el=>{
    const t = S.tasks.find(x=>x.id===el.getAttribute("data-id"));
    if(t) attachSwipe(el, t);
  });
  if(openSwipeId){
    const el = root.querySelector(`.row[data-id="${CSS.escape(openSwipeId)}"]`);
    if(el) el.style.transform = "translateX(-152px)";
  }

  // metin alanlarına imleç kaybı olmadan yazma (render tetiklemeden state'i günceller)
  const ti = document.getElementById("titleInput");
  if(ti){
    ti.addEventListener("input", ()=>{
      if(S.sheet==="add"){ S.draft.title = ti.value; const btn=root.querySelector('[data-act="save"]'); if(btn) btn.disabled = !ti.value.trim(); }
      else if(S.sheet==="detail"){ S.editBuf.title = ti.value; }
    });
    ti.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); if(S.sheet==="add") saveDraft(); else ti.blur(); } });
  }
  const ni = document.getElementById("noteInput");
  if(ni) ni.addEventListener("input", ()=>{ S.editBuf.note = ni.value; });
  const si = document.getElementById("subInput");
  if(si) si.addEventListener("keydown", e=>{
    if(e.key==="Enter" && si.value.trim()){
      const t = S.tasks.find(x=>x.id===S.editId);
      t.subtasks = t.subtasks||[]; t.subtasks.push({id:uid(), title:si.value.trim(), done:false});
      persist(); render();
    }
  });
  const nl = document.getElementById("newListInput");
  if(nl) nl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ addList(nl.value); } });
}

/* ============================================================ olay yönetimi (delegasyon) */
document.addEventListener("click", (e)=>{
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.getAttribute("data-act");

  if(act==="tab"){ S.tab=b.dataset.val; S.listView=null; render(); }
  else if(act==="openadd"){ openAdd(); }
  else if(act==="closesheet"){ closeSheet(); }
  else if(act==="closedetail"){ closeDetail(); }
  else if(act==="save"){ saveDraft(); }
  else if(act==="toggle"){ toggleDone(b.dataset.id); }
  else if(act==="open"){ openDetail(b.dataset.id); }
  else if(act==="tomorrow"){ rescheduleTomorrow(b.dataset.id); closeOpenSwipe(); }
  else if(act==="delete"){ deleteTask(b.dataset.id); closeOpenSwipe(); }
  else if(act==="deletetask"){ const id=S.editId; closeSheet(); if(id) deleteTask(id); }
  else if(act==="undo"){ undoLast(); }
  else if(act==="planday"){ openPlanDay(); }
  else if(act==="closeplan"){ S.sheet=null; render(); }
  else if(act==="planact"){ planAct(b.dataset.a); }
  else if(act==="openlist"){ S.listView=b.dataset.list; render(); }
  else if(act==="listback"){ S.listView=null; render(); }
  else if(act==="addlist"){ const inp=document.getElementById("newListInput"); addList(inp.value); }
  else if(act==="dellist"){ deleteList(b.dataset.list); }
  else if(act==="renamelist"){ const nn=prompt("Yeni ad:", b.dataset.list); if(nn) renameList(b.dataset.list, nn); }
  else if(act==="toggletheme"){ S.theme = S.theme==="dark"?"light":"dark"; persist(); render(); }
  else if(act==="togglesub"){ const t=S.tasks.find(x=>x.id===S.editId); const s=t.subtasks.find(x=>x.id===b.dataset.sub); s.done=!s.done; persist(); render(); }
  else if(act==="delsub"){ const t=S.tasks.find(x=>x.id===S.editId); t.subtasks=t.subtasks.filter(x=>x.id!==b.dataset.sub); persist(); render(); }

  else if(act==="setdate"){
    const target=b.dataset.target; const val=b.dataset.val||null;
    if(target==="add"){ S.draft.due=val; } else { patchTask(S.editId,{due:val}); }
    S.calOpenIn=null; render();
  }
  else if(act==="togglecal"){
    const target=b.dataset.target;
    S.calOpenIn = S.calOpenIn===target ? null : target;
    S.calMonth=null; render();
  }
  else if(act==="pickcal"){
    const target=b.dataset.target, val=b.dataset.val;
    if(target==="add"){ S.draft.due=val; } else { patchTask(S.editId,{due:val}); }
    S.calOpenIn=null; render();
  }
  else if(act==="calnav"){
    const dir = Number(b.dataset.dir);
    let {y,m} = S.calMonth; m+=dir; if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    S.calMonth={y,m}; render();
  }
  else if(act==="setlist"){
    const target=b.dataset.target, val=b.dataset.val;
    if(target==="add"){ S.draft.list=val; render(); } else { patchTask(S.editId,{list:val}); }
  }
  else if(act==="setrepeat"){
    const target=b.dataset.target, val=b.dataset.val||null;
    if(target==="add"){ S.draft.repeat=val; render(); } else { patchTask(S.editId,{repeat:val}); }
  }
  else if(act==="toggleflag"){
    const target=b.dataset.target;
    if(target==="add"){ S.draft.flag=!S.draft.flag; render(); } else { patchTask(S.editId,{flag:!S.tasks.find(x=>x.id===S.editId).flag}); }
  }
});
document.addEventListener("change", (e)=>{
  if(e.target.matches('[data-act="settime"]')){
    const target=e.target.dataset.target, val=e.target.value||null;
    if(target==="add"){ S.draft.time=val; } else { patchTask(S.editId,{time:val}); }
  }
});
// açık kaydırma menüsünü dışarı dokununca kapat
document.addEventListener("pointerdown",(e)=>{
  if(openSwipeId && !e.target.closest(`.row[data-id="${CSS.escape(openSwipeId)}"]`) && !e.target.closest(".rowactions")) closeOpenSwipe();
});

render();
</script>
</body>
</html>
